name: Tests
# Tier 1, two stages: every host builds its presets (no Docker or QEMU
# needed) and uploads the test binaries; then one job per execution
# environment downloads every binary for its platform, whatever host built
# it, runs it, and compares the hashes across hosts.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  HERMETIC_KEEP_ARCHIVES: "1"
  # Windows targets download the MSVC runtime and Windows SDK from Microsoft.
  HERMETIC_ACCEPT_MICROSOFT_EULA: "1"
  # macOS targets download the macOS SDK from Apple.
  HERMETIC_ACCEPT_APPLE_SDK_LICENSE: "1"

jobs:
  tables:
    name: Tables and selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -P tests/select_test.cmake
      - run: cmake -P scripts/help.cmake
      - run: cmake -DHERMETIC_DRY_RUN=ON -DHERMETIC_TARGET=linux-aarch64 -DHERMETIC_LIBC=musl -P scripts/prefetch.cmake
      - run: python3 tests/rbe_wrapper_test.py

  build:
    name: build on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            os: ubuntu-latest
            presets: host linux-x86_64-musl linux-aarch64-musl windows-x86_64 windows-x86_64-libcxx-asan windows-x86_64-libcxx windows-x86_64-libcxx-mt windows-x86_64-gnu darwin-aarch64 wasm32 wasm64 linux-x86_64-dbg windows-x86_64-dbg windows-x86_64-gnu-dbg darwin-aarch64-dbg wasm32-dbg
            rbe: linux-x86_64-dbg linux-aarch64-musl windows-x86_64-dbg windows-x86_64-libcxx-asan windows-x86_64-gnu-dbg darwin-aarch64-dbg wasm32-dbg
          - host: linux-aarch64
            os: ubuntu-24.04-arm
            presets: host linux-x86_64-musl linux-x86_64 windows-x86_64 linux-x86_64-dbg
            rbe: host linux-x86_64-dbg windows-x86_64
          - host: macos-aarch64
            os: macos-latest
            presets: host linux-aarch64 linux-x86_64-musl windows-x86_64 windows-x86_64-libcxx windows-x86_64-libcxx-mt windows-x86_64-gnu wasm32 linux-x86_64-dbg windows-x86_64-dbg windows-x86_64-gnu-dbg darwin-aarch64-dbg darwin-aarch64-hostsdk wasm32-dbg
            rbe: host linux-aarch64 windows-x86_64-dbg windows-x86_64-libcxx darwin-aarch64-dbg wasm32-dbg
          - host: windows-x86_64
            os: windows-latest
            presets: host linux-x86_64-musl linux-x86_64 windows-x86_64-gnu wasm64 linux-x86_64-dbg windows-x86_64-dbg windows-x86_64-msvc windows-x86_64-msvc-dbg
            rbe: host linux-x86_64-dbg windows-x86_64-dbg windows-x86_64-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HERMETIC_TESTS_SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hermetic-cpp/downloads
            C:/hl/downloads
          key: hermetic-cpp-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/distributions/*.json', 'cmake/HermeticLLVMRuntimes.cmake') }}
          restore-keys: hermetic-cpp-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Ninja
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ninja-build file ;;
            macOS) brew install ninja ;;
            Windows) choco install -y ninja ;;
          esac
      - name: Use a short cache path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "HERMETIC_CACHE_DIR=C:/hl" >> "$GITHUB_ENV"
      - name: Build presets (and run native ctest)
        shell: bash
        run: tests/run_tests.sh ${{ matrix.presets }}
      # Even when a preset failed: the run stage checks whatever built.
      - name: Stage binaries
        if: always()
        shell: bash
        run: tests/stage_artifacts.sh ${{ matrix.host }} ${{ matrix.presets }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bin-${{ matrix.host }}
          path: artifacts
          if-no-files-found: ignore
          retention-days: 3
      # Remote execution readiness: the rbe presets (built above, so the
      # cache is reused) through the reference wrapper, in this checkout and
      # a copy at another path; same actions and identical outputs required.
      - name: Check commands for remote execution
        shell: bash
        run: |
          export HERMETIC_CACHE_DIR="${HERMETIC_CACHE_DIR:-$HOME/.cache/hermetic-cpp}"
          tests/run_rbe_check.sh ${{ matrix.rbe }}
      - name: Upload runtime set build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.host }}
          path: |
            ~/.cache/hermetic-cpp/logs
            C:/hl/logs
          if-no-files-found: ignore
      # Separately: an artifact cannot mix C:/hl and the workspace (D:).
      - name: Upload remote execution check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rbe-logs-${{ matrix.host }}
          path: |
            tests/hello/build/rbe-*.log
            tests/hello/build/rbe-*.archives*
            tests/hello/build/rbe-*/rbe-actions.jsonl*
          if-no-files-found: ignore

  run:
    name: run ${{ matrix.environment }}
    needs: build
    # Runs even when a build job failed, on the binaries that were built.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: linux-x86_64
            os: ubuntu-latest
          - environment: linux-aarch64
            os: ubuntu-24.04-arm
          - environment: darwin-aarch64
            os: macos-latest
          - environment: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      # WebAssembly modules run under Node.js (24 or newer: memory64 for wasm64).
      - uses: actions/setup-node@v4
        if: matrix.environment == 'linux-x86_64'
        with:
          node-version: 24
      - name: Run every binary for this environment, enforce identical builds across hosts
        shell: bash
        env:
          HERMETIC_TESTS_ENFORCE_REPRODUCIBLE: "1"
        run: tests/run_artifacts.sh ${{ matrix.environment }}
