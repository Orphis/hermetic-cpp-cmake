name: Tests
# Tier 1, two stages: every host builds its presets (no Docker or QEMU
# needed) and uploads the test binaries; then one job per execution
# environment downloads every binary for its platform, whatever host built
# it, runs it, and compares the hashes across hosts.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  HERMETIC_LLVM_KEEP_ARCHIVES: "1"
  # Windows targets download the MSVC runtime and Windows SDK from Microsoft.
  HERMETIC_LLVM_ACCEPT_MICROSOFT_EULA: "1"

jobs:
  tables:
    name: Tables and selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -P tests/select_test.cmake
      - run: cmake -P scripts/help.cmake
      - run: cmake -DHERMETIC_LLVM_DRY_RUN=ON -DHERMETIC_LLVM_TARGET=linux-aarch64 -DHERMETIC_LLVM_LIBC=musl -P scripts/prefetch.cmake

  build:
    name: build on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            os: ubuntu-latest
            presets: host linux-x86_64-musl linux-aarch64-musl windows-x86_64 windows-x86_64-libcxx windows-x86_64-libcxx-mt
          - host: linux-aarch64
            os: ubuntu-24.04-arm
            presets: host linux-x86_64-musl linux-x86_64
          - host: macos-aarch64
            os: macos-latest
            presets: host linux-aarch64 linux-x86_64-musl windows-x86_64 windows-x86_64-libcxx windows-x86_64-libcxx-mt
          - host: windows-x86_64
            os: windows-latest
            presets: linux-x86_64-musl linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      HERMETIC_TESTS_SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hermetic-llvm/downloads
            C:/hl/downloads
          key: hermetic-llvm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/distributions/*.json', 'cmake/HermeticLLVMRuntimes.cmake') }}
          restore-keys: hermetic-llvm-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Ninja
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ninja-build file ;;
            macOS) brew install ninja ;;
            Windows) choco install -y ninja ;;
          esac
      - name: Use a short cache path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "HERMETIC_LLVM_CACHE_DIR=C:/hl" >> "$GITHUB_ENV"
      - name: Build presets (and run native ctest)
        shell: bash
        run: tests/run_tests.sh ${{ matrix.presets }}
      - name: Stage binaries
        shell: bash
        run: tests/stage_artifacts.sh ${{ matrix.host }} ${{ matrix.presets }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.host }}
          path: artifacts
          retention-days: 3
      - name: Upload runtime set build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.host }}
          path: |
            ~/.cache/hermetic-llvm/logs
            C:/hl/logs
          if-no-files-found: ignore

  run:
    name: run ${{ matrix.environment }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: linux-x86_64
            os: ubuntu-latest
          - environment: linux-aarch64
            os: ubuntu-24.04-arm
          - environment: darwin-aarch64
            os: macos-latest
          - environment: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: Run every binary for this environment, enforce identical builds across hosts
        shell: bash
        env:
          HERMETIC_TESTS_ENFORCE_REPRODUCIBLE: "1"
        run: tests/run_artifacts.sh ${{ matrix.environment }}
