name: Tests
# Tier 1, two stages: every host builds its presets (no Docker or QEMU
# needed) and uploads the test binaries; then one job per execution
# environment downloads every binary for its platform, whatever host built
# it, runs it, and compares the hashes across hosts.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  HERMETIC_KEEP_ARCHIVES: "1"
  # Windows targets download the MSVC runtime and Windows SDK from Microsoft.
  HERMETIC_ACCEPT_MICROSOFT_EULA: "1"
  # macOS targets download the macOS SDK from Apple.
  HERMETIC_ACCEPT_APPLE_SDK_LICENSE: "1"

jobs:
  tables:
    name: Tables and selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -P tests/select_test.cmake
      - run: cmake -P scripts/help.cmake
      - run: cmake -DHERMETIC_DRY_RUN=ON -DHERMETIC_TARGET=linux-aarch64 -DHERMETIC_LIBC=musl -P scripts/prefetch.cmake
      - run: python3 tests/rbe_wrapper_test.py

  build:
    name: build on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            os: ubuntu-latest
            presets: host linux-x86_64-musl linux-aarch64-musl windows-x86_64 windows-x86_64-libcxx-asan windows-x86_64-libcxx windows-x86_64-libcxx-mt windows-x86_64-gnu darwin-aarch64 wasm32 wasm64 linux-x86_64-dbg windows-x86_64-dbg windows-x86_64-gnu-dbg darwin-aarch64-dbg wasm32-dbg linux-x86_64-musl-mimalloc linux-x86_64-mimalloc-dbg windows-x86_64-mimalloc windows-x86_64-mimalloc-md windows-x86_64-gnu-mimalloc darwin-aarch64-mimalloc linux-x86_64-musl-mimalloc-secure
            rbe: linux-x86_64-dbg linux-aarch64-musl windows-x86_64-dbg windows-x86_64-libcxx-asan windows-x86_64-gnu-dbg darwin-aarch64-dbg wasm32-dbg linux-x86_64-mimalloc-dbg windows-x86_64-gnu-mimalloc
          - host: linux-aarch64
            os: ubuntu-24.04-arm
            presets: host linux-x86_64-musl linux-x86_64 windows-x86_64 linux-x86_64-dbg linux-aarch64-mimalloc linux-aarch64-musl-mimalloc linux-x86_64-musl-mimalloc
            rbe: host linux-x86_64-dbg windows-x86_64 linux-aarch64-mimalloc
          - host: macos-aarch64
            os: macos-latest
            presets: host linux-aarch64 linux-x86_64-musl windows-x86_64 windows-x86_64-libcxx windows-x86_64-libcxx-mt windows-x86_64-gnu wasm32 linux-x86_64-dbg windows-x86_64-dbg windows-x86_64-gnu-dbg darwin-aarch64-dbg darwin-aarch64-hostsdk wasm32-dbg darwin-aarch64-mimalloc linux-x86_64-musl-mimalloc windows-x86_64-mimalloc-dbg windows-x86_64-mimalloc-md
            rbe: host linux-aarch64 windows-x86_64-dbg windows-x86_64-libcxx darwin-aarch64-dbg wasm32-dbg darwin-aarch64-mimalloc
          - host: windows-x86_64
            os: windows-latest
            presets: host linux-x86_64-musl linux-x86_64 windows-x86_64-gnu wasm64 linux-x86_64-dbg windows-x86_64-dbg windows-x86_64-mimalloc windows-x86_64-mimalloc-dbg windows-x86_64-mimalloc-md windows-x86_64-gnu-mimalloc linux-x86_64-mimalloc-dbg
            rbe: host linux-x86_64-dbg windows-x86_64-dbg windows-x86_64-gnu windows-x86_64-mimalloc-dbg windows-x86_64-mimalloc-md
          # cl.exe builds in a job of their own: they download the compiler
          # packages and keep the main Windows job's duration in line.
          - host: windows-x86_64-msvc
            os: windows-latest
            presets: windows-x86_64-msvc windows-x86_64-msvc-dbg windows-x86_64-msvc-mimalloc windows-x86_64-msvc-mimalloc-md
            rbe: windows-x86_64-msvc-dbg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HERMETIC_TESTS_SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      # Downloaded archives: restored by every run, saved by runs on master
      # only, so that branches and pull requests reuse master's instead of
      # storing their own copy (400 to 600 MB per host) whenever the tables
      # differ; an archive that master does not have yet is downloaded.
      - name: Restore downloaded archives
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/hermetic-cpp/downloads
            C:/hl/downloads
          key: hermetic-cpp-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/distributions/*.json') }}
          restore-keys: hermetic-cpp-downloads-${{ runner.os }}-${{ runner.arch }}-
      # Runtime sets built by an earlier run of this job with the same recipe
      # (everything under runtimes/ and cmake/): an exact match or nothing,
      # so a change to the recipe always rebuilds them. Nightly still builds
      # every set from source.
      - name: Cache runtime sets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hermetic-cpp/runtimes
            C:/hl/runtimes
          key: hermetic-cpp-runtimes-${{ matrix.host }}-${{ hashFiles('runtimes/**', 'cmake/**') }}
      - name: Install Ninja
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ninja-build file ;;
            macOS) brew install ninja ;;
            Windows) choco install -y ninja ;;
          esac
      - name: Use a short cache path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "HERMETIC_CACHE_DIR=C:/hl" >> "$GITHUB_ENV"
      - name: Build presets (and run native ctest)
        shell: bash
        run: tests/run_tests.sh ${{ matrix.presets }}
      # Whether or not every preset built: the archives are checked downloads.
      - name: Save downloaded archives
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && steps.downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/hermetic-cpp/downloads
            C:/hl/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # Even when a preset failed: the run stage checks whatever built.
      - name: Stage binaries
        if: always()
        shell: bash
        run: tests/stage_artifacts.sh ${{ matrix.host }} ${{ matrix.presets }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bin-${{ matrix.host }}
          path: artifacts
          if-no-files-found: ignore
          retention-days: 3
      # Remote execution readiness: the rbe presets (built above, so the
      # cache is reused) through the reference wrapper, in this checkout and
      # a copy at another path; same actions and identical outputs required.
      - name: Check commands for remote execution
        shell: bash
        run: |
          export HERMETIC_CACHE_DIR="${HERMETIC_CACHE_DIR:-$HOME/.cache/hermetic-cpp}"
          tests/run_rbe_check.sh ${{ matrix.rbe }}
      - name: Upload runtime set build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.host }}
          path: |
            ~/.cache/hermetic-cpp/logs
            C:/hl/logs
          if-no-files-found: ignore
      # Separately: an artifact cannot mix C:/hl and the workspace (D:).
      - name: Upload remote execution check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rbe-logs-${{ matrix.host }}
          path: |
            tests/hello/build/rbe-*.log
            tests/hello/build/rbe-*.archives*
            tests/hello/build/rbe-*/rbe-actions.jsonl*
          if-no-files-found: ignore

  # vcpkg packages built with the toolchain (tests/run_vcpkg.sh), after the
  # build jobs so that their runtime sets are cached: toolchain/<triplet>
  # with HERMETIC_VCPKG=ON, <triplet> with vcpkg's toolchain file in front;
  # those marked :run execute on the runner.
  vcpkg:
    name: vcpkg on ${{ matrix.host }}
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            os: ubuntu-latest
            triplets: toolchain/x64-linux-musl-hermetic:run x64-linux-hermetic:run toolchain/x64-windows-static-hermetic x64-mingw-static-hermetic
          - host: macos-aarch64
            os: macos-latest
            triplets: toolchain/arm64-osx-hermetic:run toolchain/x64-linux-musl-hermetic
          - host: windows-x86_64
            os: windows-latest
            triplets: toolchain/x64-windows-static-md-hermetic:run x64-windows-static-hermetic:run toolchain/x64-mingw-static-hermetic:run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore downloaded archives
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/hermetic-cpp/downloads
            C:/hl/downloads
          key: hermetic-cpp-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/distributions/*.json') }}
          restore-keys: hermetic-cpp-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore runtime sets
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/hermetic-cpp/runtimes
            C:/hl/runtimes
          key: hermetic-cpp-runtimes-${{ matrix.host }}-${{ hashFiles('runtimes/**', 'cmake/**') }}
      - name: Install Ninja and pkg-config
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ninja-build pkg-config ;;
            macOS) brew install ninja pkgconf ;;
            Windows) choco install -y ninja ;;
          esac
      - name: Use short paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "HERMETIC_CACHE_DIR=C:/hl" >> "$GITHUB_ENV"
          echo "HERMETIC_VCPKG_WORK=C:/v" >> "$GITHUB_ENV"
      - name: Build and check vcpkg packages
        shell: bash
        run: tests/run_vcpkg.sh ${{ matrix.triplets }}

  run:
    name: run ${{ matrix.environment }}
    needs: build
    # Runs even when a build job failed, on the binaries that were built.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: linux-x86_64
            os: ubuntu-latest
          - environment: linux-aarch64
            os: ubuntu-24.04-arm
          - environment: darwin-aarch64
            os: macos-latest
          - environment: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      # WebAssembly modules run under Node.js (24 or newer: memory64 for wasm64).
      - uses: actions/setup-node@v4
        if: matrix.environment == 'linux-x86_64'
        with:
          node-version: 24
      - name: Run every binary for this environment, enforce identical builds across hosts
        shell: bash
        env:
          HERMETIC_TESTS_ENFORCE_REPRODUCIBLE: "1"
        run: tests/run_artifacts.sh ${{ matrix.environment }}
