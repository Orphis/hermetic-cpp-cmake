name: Nightly
# Tier 2: the broad matrix (glibc version sweep, sanitizers, every Linux
# architecture under QEMU, compiler version selection, macOS x86_64). Runs on
# a schedule and on demand; each matrix entry is one runner job.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      presets:
        description: Space separated presets to run instead of the matrix (all jobs)
        required: false
        default: ""

env:
  HERMETIC_LLVM_KEEP_ARCHIVES: "1"
  HERMETIC_TESTS_REQUIRE_DOCKER: "1"

jobs:
  matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc version pinning: built binaries run on a matching Debian
          # release and are refused by an older one.
          - name: glibc sweep (x86_64)
            os: ubuntu-latest
            presets: linux-x86_64 linux-x86_64-gnu.2.34 linux-x86_64-gnu.2.44
          - name: glibc sweep (aarch64)
            os: ubuntu-24.04-arm
            presets: linux-aarch64 linux-x86_64-gnu.2.44
          # Sanitizer runtimes, executed natively on the matching runner.
          - name: sanitizers (x86_64)
            os: ubuntu-latest
            presets: linux-x86_64-asan linux-x86_64-ubsan
          - name: sanitizers (aarch64)
            os: ubuntu-24.04-arm
            presets: linux-aarch64-asan
          # Architectures without a native runner, executed under QEMU.
          - name: armv7 / riscv64 / s390x
            os: ubuntu-latest
            presets: linux-armv7 linux-armv7-musl linux-riscv64 linux-riscv64-musl linux-s390x linux-s390x-musl
          # Compiler version selection: unpinned latest, the oldest prebuilt,
          # and a requirement expression.
          - name: compiler versions (linux)
            os: ubuntu-latest
            presets: host-latest host-21.1.8 host-first-22
          - name: compiler versions (macos)
            os: macos-latest
            presets: host-latest host-21.1.8
          # macOS x86_64: native on an Intel runner, and cross from arm64.
          - name: macos-x86_64 host
            os: macos-15-intel
            presets: host
          - name: darwin-x86_64 from arm64
            os: macos-latest
            presets: darwin-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/hermetic-llvm/downloads
          key: hermetic-llvm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/distributions/*.json', 'cmake/HermeticLLVMRuntimes.cmake') }}
          restore-keys: hermetic-llvm-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build file; else brew install ninja; fi
      - name: Register QEMU for foreign Linux architectures
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
      - name: Docker is optional on macOS runners
        if: runner.os == 'macOS'
        run: echo "HERMETIC_TESTS_REQUIRE_DOCKER=0" >> "$GITHUB_ENV"
      - name: Build and run presets
        run: tests/run_tests.sh ${{ github.event.inputs.presets || matrix.presets }}
      - name: Upload runtime set build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ strategy.job-index }}
          path: ~/.cache/hermetic-llvm/logs
          if-no-files-found: ignore

  # A configuration must also work with an empty cache in one invocation.
  cold-start:
    name: cold start (empty cache)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -DHERMETIC_LLVM_CACHE_DIR="$RUNNER_TEMP/fresh" -DHERMETIC_LLVM_TARGET=linux-aarch64 -DHERMETIC_LLVM_LIBC=musl -DHERMETIC_LLVM_RUNTIME_SANITIZERS=ON -P scripts/prefetch.cmake
