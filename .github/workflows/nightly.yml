name: Nightly
# Tier 2, two stages like tests.yml but with the broad matrix: glibc version
# sweep, sanitizers, every Linux architecture (run under QEMU where no runner
# exists), compiler version selection, macOS x86_64, plus a cold-start job.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      presets:
        description: Space separated presets to build instead of the matrix (all build jobs)
        required: false
        default: ""

env:
  HERMETIC_LLVM_KEEP_ARCHIVES: "1"
  HERMETIC_LLVM_ACCEPT_MICROSOFT_EULA: "1"
  # macOS targets download the macOS SDK from Apple.
  HERMETIC_LLVM_ACCEPT_APPLE_SDK_LICENSE: "1"

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glibc sweep (linux-x86_64)
            host: linux-x86_64-glibc
            os: ubuntu-latest
            presets: linux-x86_64 linux-x86_64-gnu.2.34 linux-x86_64-gnu.2.44 linux-aarch64
            rbe: linux-x86_64-gnu.2.44
          - name: glibc sweep (linux-aarch64)
            host: linux-aarch64-glibc
            os: ubuntu-24.04-arm
            presets: linux-aarch64 linux-x86_64-gnu.2.44 linux-x86_64 darwin-x86_64 darwin-aarch64-dbg wasm32 wasm64
          - name: sanitizers (linux-x86_64)
            host: linux-x86_64-san
            os: ubuntu-latest
            presets: linux-x86_64-asan linux-x86_64-ubsan
            rbe: linux-x86_64-asan linux-x86_64-ubsan
          - name: sanitizers (linux-aarch64)
            host: linux-aarch64-san
            os: ubuntu-24.04-arm
            presets: linux-aarch64-asan
          - name: armv7 / riscv64 / s390x
            host: linux-x86_64-exotic
            os: ubuntu-latest
            presets: linux-armv7 linux-armv7-musl linux-riscv64 linux-riscv64-musl linux-s390x linux-s390x-musl
          - name: compiler versions (linux)
            host: linux-x86_64-versions
            os: ubuntu-latest
            presets: host-latest host-21.1.8 host-first-22
          - name: compiler versions (macos)
            host: macos-aarch64-versions
            os: macos-latest
            presets: host-latest host-21.1.8 linux-x86_64 linux-x86_64-gnu.2.44
          - name: macos-x86_64
            host: macos-x86_64
            os: macos-15-intel
            presets: host linux-x86_64-musl windows-x86_64 darwin-x86_64-dbg
            rbe: host darwin-x86_64-dbg
          # Windows host: one job per runtime set, since each job starts
          # with an empty cache and a Windows set (libc++ x4 CRT flavours,
          # sanitizers) takes about ten minutes to build.
          - name: windows-x86_64 (linux and macOS targets)
            host: windows-x86_64-linux
            os: windows-latest
            presets: linux-x86_64 linux-aarch64-musl linux-x86_64-gnu.2.44 darwin-aarch64
            rbe: linux-x86_64 darwin-aarch64
          - name: windows-x86_64 (windows-x86_64 targets)
            host: windows-x86_64
            os: windows-latest
            presets: windows-x86_64 windows-x86_64-libcxx-asan windows-x86_64-libcxx-ubsan windows-x86_64-asan windows-x86_64-libcxx windows-x86_64-libcxx-mt windows-x86_64-libcxx-dbg
            rbe: windows-x86_64-libcxx-dbg windows-x86_64-asan
          - name: windows-x86_64 (windows-aarch64 targets)
            host: windows-x86_64-arm64
            os: windows-latest
            presets: windows-aarch64 windows-aarch64-libcxx
          - name: windows-aarch64 host
            host: windows-aarch64
            os: windows-11-arm
            presets: host linux-aarch64-musl windows-x86_64 windows-aarch64-gnu darwin-aarch64 wasm32
            rbe: host windows-x86_64
          - name: windows-x86_64 targets from linux
            host: linux-x86_64-windows
            os: ubuntu-latest
            presets: windows-x86_64 windows-x86_64-vs2022 windows-x86_64-libcxx-asan windows-x86_64-libcxx-ubsan windows-x86_64-asan windows-x86_64-libcxx windows-x86_64-libcxx-mt windows-x86_64-libcxx-dbg
            rbe: windows-x86_64-vs2022 windows-x86_64-libcxx-dbg
          - name: windows-aarch64 targets from linux
            host: linux-x86_64-windows-arm64
            os: ubuntu-latest
            presets: windows-aarch64 windows-aarch64-libcxx windows-aarch64-gnu
          - name: darwin-x86_64 from arm64
            host: macos-aarch64-cross
            os: macos-latest
            presets: darwin-x86_64 darwin-aarch64 darwin-x86_64-dbg
            rbe: darwin-x86_64-dbg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HERMETIC_TESTS_SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hermetic-llvm/downloads
            C:/hl/downloads
          key: hermetic-llvm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/distributions/*.json', 'cmake/HermeticLLVMRuntimes.cmake') }}
          restore-keys: hermetic-llvm-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Ninja
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ninja-build file ;;
            macOS) brew install ninja ;;
            Windows) choco install -y ninja ;;
          esac
      - name: Use a short cache path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "HERMETIC_LLVM_CACHE_DIR=C:/hl" >> "$GITHUB_ENV"
      - name: Build presets (and run native ctest)
        shell: bash
        run: tests/run_tests.sh ${{ github.event.inputs.presets || matrix.presets }}
      - name: Stage binaries
        shell: bash
        run: tests/stage_artifacts.sh ${{ matrix.host }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.host }}
          path: artifacts
          retention-days: 3
      # Remote execution readiness (see tests.yml), on the presets built above.
      - name: Check commands for remote execution
        if: matrix.rbe && !github.event.inputs.presets
        shell: bash
        run: |
          export HERMETIC_LLVM_CACHE_DIR="${HERMETIC_LLVM_CACHE_DIR:-$HOME/.cache/hermetic-llvm}"
          tests/run_rbe_check.sh ${{ matrix.rbe }}
      - name: Upload runtime set build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.host }}
          path: |
            ~/.cache/hermetic-llvm/logs
            C:/hl/logs
            tests/hello/build/rbe-*.log
            tests/hello/build/rbe-*.archives*
            tests/hello/build/rbe-*/rbe-actions.jsonl*
          if-no-files-found: ignore

  run:
    name: run ${{ matrix.environment }}
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: linux-x86_64
            os: ubuntu-latest
          - environment: linux-aarch64
            os: ubuntu-24.04-arm
          - environment: linux-qemu
            os: ubuntu-latest
          - environment: darwin-aarch64
            os: macos-latest
          - environment: darwin-x86_64
            os: macos-15-intel
          - environment: windows-x86_64
            os: windows-latest
          - environment: windows-aarch64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      # WebAssembly modules run under Node.js (24 or newer: memory64 for wasm64).
      - uses: actions/setup-node@v4
        if: matrix.environment == 'linux-x86_64'
        with:
          node-version: 24
      - name: Register QEMU
        if: matrix.environment == 'linux-qemu'
        uses: docker/setup-qemu-action@v3
      - name: Run every binary for this environment, enforce identical builds across hosts
        shell: bash
        env:
          HERMETIC_TESTS_ENFORCE_REPRODUCIBLE: "1"
        run: tests/run_artifacts.sh ${{ matrix.environment }}

  # A configuration must also work with an empty cache in one invocation.
  cold-start:
    name: cold start (empty cache)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -DHERMETIC_LLVM_CACHE_DIR="$RUNNER_TEMP/fresh" -DHERMETIC_LLVM_TARGET=linux-aarch64 -DHERMETIC_LLVM_LIBC=musl -DHERMETIC_LLVM_RUNTIME_SANITIZERS=ON -P scripts/prefetch.cmake
